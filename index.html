<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/card.css">
    <script src="src/components/card-news.js" defer></script>
    <script src="src/components/dynamic-title.js" defer></script>
    <title>Portal de notícias de anime</title>
</head>
<body>
    <div class="container">
        <dynamic-title title="Notícias de Anime"></dynamic-title>
        <card-news
            author="Victor"
            title="Anime Awards 2026"
            link-url="https://www.crunchyroll.com/pt-pt/news/latest/2026/5/22/anime-awards-2026-lista-vencedores"
            content="Veja os animes que vão concorrer no evento da premiação"
            img-url="assets/anime-awards.jpg"
            img-alt="Anime Awards"    
        ></card-news>

        <card-news
            author="Victor"
            title="One Piece"
            link-url="https://www.crunchyroll.com/pt-br/news"
            content="Confira as novidades e os próximos acontecimentos do anime mais popular da atualidade"
            img-url="assets/one-piece.jpg"
            img-alt="One Piece"
        ></card-news>

        <card-news
            author="Victor"
            title="Solo Leveling"
            link-url="https://www.crunchyroll.com/pt-br/news"
            content="Solo Leveling continua em destaque entre os principais animes da temporada"
            img-url="assets/solo-leveling.jpg"
            img-alt="Solo Leveling"
        ></card-news>

        <card-news
            author="Victor"
            title="Demon Slayer"
            link-url="https://www.crunchyroll.com/pt-br/news"
            content="Veja as últimas novidades sobre o futuro da franquia Demon Slayer"
            img-url="assets/demon-slayer.jpg"
            img-alt="Demon Slayer"
        ></card-news>

        <card-news
            author="Victor"
            title="Jujutsu Kaisen"
            link-url="https://www.crunchyroll.com/pt-br/news"
            content="Novas informações sobre a próxima fase de Jujutsu Kaisen"
            img-url="assets/jujutsu-kaisen.jpg"
            img-alt="Jujutsu Kaisen"
        ></card-news>

        <card-news
            author="Victor"
            title="My Hero Academia"
            link-url="https://www.crunchyroll.com/pt-br/news"
            content="Confira as novidades mais recentes do universo de My Hero Academia"
            img-url="assets/my-hero-academia.jpg"
            img-alt="My Hero Academia"
        ></card-news>

        <card-news
            author="Victor"
            title="Chainsaw Man"
            link-url="https://www.crunchyroll.com/pt-br/news"
            content="Chainsaw Man ganha novidades e aumenta a expectativa dos fãs"
            img-url="assets/chainsaw-man.jpg"
            img-alt="Chainsaw Man"
        ></card-news>

        <card-news
            author="Victor"
            title="Attack on Titan"
            link-url="https://www.crunchyroll.com/pt-br/news"
            content="Relembre momentos marcantes e o legado de Attack on Titan"
            img-url="assets/attack-on-titan.jpg"
            img-alt="Attack on Titan"
        ></card-news>

        <card-news
            author="Victor"
            title="Dragon Ball"
            link-url="https://www.crunchyroll.com/pt-br/news"
            content="Confira as novidades e anúncios relacionados à franquia Dragon Ball"
            img-url="assets/dragon-ball.jpg"
            img-alt="Dragon Ball"
        ></card-news>
    </div>
</body>
</html>
